name: Build UK food database

# Downloads the Open Food Facts export, keeps UK products, and publishes the
# compact database the app downloads onto the phone. Output lives on the `db`
# branch (force-pushed, one commit) so the main branch history doesn't grow.
on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build-db.js
      - .github/workflows/build-db.yml

permissions:
  contents: write

concurrency:
  group: build-db
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Open Food Facts export
        run: curl -fL --retry 3 --retry-delay 30 -o products.csv.gz https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz

      - name: Build UK database
        run: node tools/build-db.js products.csv.gz out

      - name: Publish to db branch
        run: |
          cd out
          git init -q -b db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uk.ndjson.gz meta.json
          git commit -q -m "UK food database $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" db
